name: Build packages

# A tag vX.Y.Z builds luci-app-dawnline and its translation packages
# (luci-i18n-dawnline-<lang>) as .ipk (OpenWrt 24.10, opkg) and .apk (OpenWrt
# 25.12, apk) with the OpenWrt SDK and publishes a GitHub release with the
# packages and sha256sums.txt, the files install.sh and the in-app updater
# download. The release notes list what changed since the previous tag, from the
# commits (scripts/release-notes.sh). Run it by hand to get the packages as
# workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the release job may write (publish the release).
# Everything that runs here is pinned to a digest or a commit: the packages
# it publishes are installed as root on every router with automatic updates
# on, so a re-pointed tag must not be able to change what gets built.
permissions:
  contents: read

jobs:
  # The same checks as on main (ci.yml), on the tag itself: nothing is built or
  # published until they pass.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read and check the version
        id: version
        run: |
          v="$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-dawnline/Makefile)"
          grep -q "^export const VERSION = '$v';" package/luci-app-dawnline/root/usr/share/ucode/dawnline/util.uc ||
            { echo "::error::util.uc VERSION differs from the Makefile ($v)"; exit 1; }
          grep -q "\"version\": \"$v\"" web/package.json ||
            { echo "::error::web/package.json version differs from the Makefile ($v)"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package version v$v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.type }}
    runs-on: ubuntu-24.04
    needs: [version, ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { type: ipk, sdk: 'itdoginfo/openwrt-sdk-ipk:24.10.6@sha256:a6bd28c380b251ebdb1d6d5f83e55ecb0a3c1808b5a8f4841424abc8019a903f' }
          - { type: apk, sdk: 'itdoginfo/openwrt-sdk-apk:25.12.3@sha256:6d832008ddd1b8ec4edc84f5e6e0bf22a13ba2d6888083a8e69fa26d752c276f' }
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web bundles
        working-directory: web
        run: |
          npm ci
          npm run --silent build

      - name: Build the ${{ matrix.type }} with the OpenWrt SDK
        env:
          IPK_SDK: ${{ matrix.sdk }}
          APK_SDK: ${{ matrix.sdk }}
        run: scripts/build-packages.sh ${{ matrix.type }}

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.type }}
          # The app and its translation packages (luci-i18n-dawnline-<lang>).
          path: dist/luci-*-${{ needs.version.outputs.version }}.${{ matrix.type }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [version, build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      # The whole history and the tags: the notes list the commits since the previous tag.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release notes
        run: |
          sh scripts/release-notes.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > notes.md
          cat notes.md

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum luci-* > sha256sums.txt
          cat sha256sums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Dawnline ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release/*
          body_path: notes.md
